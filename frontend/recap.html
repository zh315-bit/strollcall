<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A StrollCall walk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bits.css">
</head>
<body>
<main>
  <h1>A walk together</h1>
  <p class="tagline">Less planning. More meeting.</p>
  <div id="recap"><p class="muted"><span class="spinner"></span>Loading…</p></div>
  <footer>Map data © OpenStreetMap contributors (ODbL). Language features by Meta Muse models.</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/bits.js"></script>
<script src="/static/js/specular.js"></script>
<script src="/static/js/backdrop.js"></script>
<script src="/static/js/gridmotion.js"></script>
<script>
// A shared recap: the meeting point, the destination and the walk between them. No start points.
(async () => {
  const box = document.getElementById("recap");
  let r;
  try { r = await api(`/api/recaps/${location.pathname.split("/").pop()}`); }
  catch (e) { box.replaceChildren(el("section", { class: "card" }, el("p", {}, e.message), el("a", { href: "/" }, "Plan a walk"))); return; }
  const mapEl = el("div", { class: "recap-map" });
  const day = new Date(`${r.date}T12:00:00`).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  box.replaceChildren(el("section", { class: "card recap" },
    el("h2", {}, `A walk on ${day}`),
    r.image_url ? el("img", { class: "recap-image", src: r.image_url, alt: "Illustration of two friends walking together" }) : null,
    el("div", { class: "recap-stats" },
      el("div", {}, el("b", {}, r.minutes_walked), "min walked"),
      el("div", {}, el("b", {}, Math.round(r.shared_min)), "min together"),
      el("div", {}, el("b", {}, r.places.length), "places passed")),
    el("p", {}, `Met at ${r.meetup.name}, then walked together to ${r.destination.name}.`),
    r.places.length ? el("p", { class: "muted" }, "Passed: ", r.places.map((p) => p.name).join(", ")) : null,
    mapEl,
    el("p", { class: "muted small" }, "Shows the walk together only, never where anyone started. ",
      `This page is deleted on ${new Date(r.expires_at).toLocaleDateString()}.`),
    el("a", { href: "/" }, "Plan your own walk")));
  const map = L.map(mapEl, { zoomControl: false, dragging: false, scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: OSM_ATTRIBUTION }).addTo(map);
  const color = getComputedStyle(document.documentElement).getPropertyValue("--shared").trim();
  const layers = [L.marker([r.meetup.lat, r.meetup.lon]).addTo(map), L.marker([r.destination.lat, r.destination.lon]).addTo(map)];
  if (r.shared_geometry.length > 1) layers.push(L.polyline(r.shared_geometry, { color, weight: 5 }).addTo(map));
  map.fitBounds(L.featureGroup(layers).getBounds(), { padding: [16, 16] });
})();
</script>
</body>
</html>
