<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StrollCall invite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bits.css">
  <!-- Hold the first render until the top bar, header and sky are built, so a page switch never
       shows the bare page. Browsers without rel="expect" ignore it. -->
  <link rel="expect" href="#chrome-ready" blocking="render">
</head>
<body>
<main>
  <h1>StrollCall</h1>
  <div class="layout">
    <div class="pane-left">
      <div id="banner"></div>
      <div id="app"><p class="muted"><span class="spinner"></span>Loading…</p></div>
    </div>
    <div class="pane-right">
      <div id="map" hidden></div>  <!-- before the card: on a phone the map follows the form/plan directly -->
      <div id="side"></div>
      <div id="after"></div>
    </div>
  </div>
  <footer>Map data © OpenStreetMap contributors (ODbL). Walking times assume 80 m/min. StrollCall never
    claims a route or place is safe, quiet or open beyond what the data says.</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/bits.js"></script>
<script src="/static/js/specular.js"></script>
<script src="/static/js/gridmotion.js"></script>
<script src="/static/js/backdrop.js"></script>
<script src="/static/js/plandeck.js"></script>
<div id="chrome-ready" hidden></div> <!-- first render waits for the scripts above (see <head>) -->
<script src="/static/js/walk.js"></script>
<script>
const token = location.pathname.split("/").pop();
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let key = new URLSearchParams(location.hash.slice(1)).get("key") || store.get(`strollcall:${token}`);
if (key) store.set(`strollcall:${token}`, key);
const app = document.getElementById("app");
let map = null, layers = [], pollTimer = null, chosen = 0, bOrigin = null, bMarker = null;

async function load() {
  try {
    const v = await api(`/api/invites/${token}`, key ? { headers: { "X-Invite-Key": key } } : {});
    if (v.role === "a" || v.role === "b") rememberWalk(token, v.role);  // for My walks, on this device only
    render(v);
    clearTimeout(pollTimer);
    if (v.status === "planning") {
      pollTimer = setTimeout(load, 1500); // show each planning step as it happens
    } else if (v.status === "pending" && v.role !== "guest") {
      pollTimer = setTimeout(load, 5000); // A waits for B
    }
  } catch (e) {
    app.replaceChildren(el("p", { class: "error" }, e.message));
  }
}

function card(v) {
  return el("section", { class: "card" },
    v.image_url ? el("img", { class: "card-image", src: v.image_url, alt: "Illustration of two friends walking toward each other" }) : null,
    v.image_url ? el("p", { class: "muted small" }, "Illustration made with Muse Image for this kind of walk.") : null,
    el("p", { class: "invite-text" }, v.invite_text, sourceBadge(v.sources.invite_text)),
    el("p", { class: "muted" }, `${v.a_intent.duration_min}-minute walk, ending ${v.a_intent.endpoint_type ? "at a " + prettyType(v.a_intent.endpoint_type) : "anywhere nice"}`
      + (v.a_intent.vibes.length ? ` · ${v.a_intent.vibes.join(", ")}` : "")));
}

function render(v) {
  document.getElementById("banner").replaceChildren(demoBanner(v.sources) || "");
  document.getElementById("side").replaceChildren(card(v));
  const parts = [];
  if (v.status === "expired") parts.push(el("p", { class: "error" }, "This invite has expired."));
  else if (v.status === "pending" && v.role === "a") parts.push(waitingForB(v));
  else if (v.status === "pending") parts.push(acceptForm(v));
  else if (v.status === "planning") parts.push(progressSteps(v.progress));
  else if (v.status === "error") parts.push(problem(v));
  else parts.push(...plan(v));
  app.replaceChildren(...parts);
  const walked = v.role !== "guest" && finishedWalk(token);
  document.getElementById("after").replaceChildren(
    walked ? el("section", { class: "card" }, el("p", {}, `Walk finished: about ${walked.minutes} min. `,
      el("a", { href: "/walks" }, "See your recap in My walks"))) : "",
    v.status === "confirmed" && v.role !== "guest" ? survey(v) : "");
  if (["proposed", "confirmed"].includes(v.status)) drawPlan(v);
}

const STEPS = [["understanding", "Understanding your preferences"], ["balancing", "Balancing both of you"],
               ["finding", "Finding a fair meeting point"], ["done", "Done"]];

function progressSteps(progress) {
  const current = progress ? STEPS.findIndex(([k]) => k === progress.step) : 0;
  return el("section", { class: "card" }, el("ol", { class: "steps" }, STEPS.map(([k, label], i) =>
    el("li", { class: i < current ? "done" : i === current ? "active" : "" },
      i < current ? el("span", { class: "i i-check", "aria-hidden": "true" }) : i === current ? el("span", { class: "spinner" }) : "", label))));
}

function waitingForB(v) {
  const link = `${location.origin}/i/${v.token}`;
  return el("section", { class: "card" },
    el("h2", {}, "Send this link to your friend"),
    el("p", { class: "share" }, link),
    el("div", { class: "row" },
      el("button", { class: "primary", onclick: () => navigator.share ? navigator.share({ url: link, text: v.invite_text }) : navigator.clipboard.writeText(link) }, "Share"),
      el("button", { onclick: () => navigator.clipboard.writeText(link) }, "Copy")),
    el("p", { class: "muted" }, el("span", { class: "spinner" }), "Waiting for your friend to accept. This page updates by itself."));
}

function acceptForm(v) {
  const text = el("textarea", { placeholder: "Optional: anything you'd like? e.g. somewhere green, I'm bringing my dog",
    "aria-describedby": "text-hint" });
  const status = el("p", { class: "muted" }, "Tap “Use my location” or tap the map to set where you start.");
  const go = el("button", { class: "primary", disabled: "" }, "I'm in");
  const showMap = () => {
    const m = document.getElementById("map"); m.hidden = false;
    if (!map) {
      map = makeMap("map");
      drawCoverage(map);
      map.on("click", (e) => setB(e.latlng.lat, e.latlng.lng));
    }
  };
  const setB = (lat, lon) => {
    if (bMarker) bMarker.setLatLng([lat, lon]); else bMarker = L.marker([lat, lon]).addTo(map);
    if (inCoverage(lat, lon) === false) {
      bOrigin = null; go.setAttribute("disabled", "");
      status.replaceChildren(el("span", { class: "error" }, OUTSIDE_MESSAGE(coverageData.label)));
      return;
    }
    bOrigin = { lat, lon };
    status.textContent = "Start point set."; go.removeAttribute("disabled");
  };
  go.addEventListener("click", async () => {
    go.setAttribute("disabled", "");
    try {
      const r = await api(`/api/invites/${token}/accept`, { method: "POST", body: { b_origin: bOrigin, b_text: text.value.trim() } });
      key = r.b_key; store.set(`strollcall:${token}`, key);
      history.replaceState(null, "", `#key=${encodeURIComponent(key)}`);
      document.getElementById("map").hidden = true;
      load();
    } catch (e) { status.textContent = e.message; go.removeAttribute("disabled"); }
  });
  setTimeout(showMap, 0);
  return el("section", { class: "card" },
    el("h2", {}, "Join the walk"),
    el("p", { class: "muted" }, "Your location is only used to find a fair meeting point. Your friend sees the plan, never your exact start, and it is deleted when the invite expires."),
    el("div", { class: "row" }, el("button", { onclick: () => navigator.geolocation.getCurrentPosition(
      (p) => { setB(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 15); },
      () => alert("Location not available. Tap the map instead."), { enableHighAccuracy: true, timeout: 10000 }) }, "Use my location")),
    status,
    el("div", { class: "row" }, micButton(text)), text,
    el("p", { class: "muted", id: "text-hint" }, "What you type or say goes to Meta's models, which may use it to improve their products. Please leave out names, addresses and other personal details."),
    el("div", { class: "row" }, go));
}

function problem(v) {
  const f = v.failure;
  const msg = { no_feasible_plan: "We couldn't find a fair walk for you two.", routing_unavailable: "Unable to verify a walking route right now.",
                places_unavailable: "Place data is unavailable right now.", model_unavailable: "Our language model is unavailable right now." }[v.error] || v.error;
  return el("section", { class: "card" }, el("p", { class: "error" }, msg),
    f ? el("p", {}, f.suggestion) : null,
    v.error === "routing_unavailable" ? el("p", { class: "muted" }, "Open a map app to plan the walk yourselves.") : null);
}

// Several plans: each whole option is a page of a swipeable deck (plandeck.js); one plan: just that page.
function plan(v) {
  const label = (c, i) => `${i === 0 ? "Best" : `Option ${i + 1}`} · ${v.places[c.meeting_place_id].name}`;
  const pages = v.candidates.map((c, i) => planPage(v, c, v.candidates.length > 1 ? label(c, i) : null));
  const deck = pages.length > 1 ? planDeck(pages, { start: Math.min(chosen, pages.length - 1), labels: v.candidates.map(label),
    onChange: (i) => { chosen = i; drawPlan(v); } }) : null;
  return [
    el("section", { class: "card" },
      deck ? deck.el : pages[0],
      v.tradeoff ? el("p", { class: "muted" }, v.tradeoff, sourceBadge(v.sources.negotiation)) : null,
      ...(v.notes || []).map((n) => el("p", { class: "muted" }, el("span", { class: "i i-info", "aria-hidden": "true" }), " ", n)),
      el("p", { class: "legend muted" }, el("span", { style: "background:var(--a)" }), "A", el("span", { style: "background:var(--b)" }), "B",
        el("span", { style: "background:var(--shared)" }), "together")),
  ];
}

function planPage(v, c, kicker) {
  const meet = v.places[c.meeting_place_id], dest = v.places[c.endpoint_place_id];
  const why = v.reasons[c.id];
  return el("div", {},
    kicker ? el("p", { class: "plan-kicker" }, kicker) : null,
    el("h2", {}, `Meet at ${meet.name}`),
    el("div", { class: "times" },
      el("div", {}, el("b", {}, Math.round(c.a_leg.duration_min)), "min for A"),
      el("div", {}, el("b", {}, Math.round(c.b_leg.duration_min)), "min for B"),
      el("div", {}, el("b", {}, Math.round(c.shared_leg.duration_min)), "min together")),
    el("p", {}, `Then walk together to ${dest.name} (${prettyType(dest.category)}). `,
      el("span", { class: "muted" }, `Arrival gap ${c.arrival_gap_min.toFixed(1)} min, ${Math.round(c.total_elapsed_min)} min in total.`)),
    el("p", {}, why || c.rationale, why ? (sourceBadge(v.sources.ranking) || el("span", { class: "muted" }, " · Muse Spark")) : null),
    el("p", { class: "muted" }, dest.opening_hours ? `Opening hours (OpenStreetMap, as of ${(dest.fetched_at || "").slice(0, 10)}): ${dest.opening_hours}` : "Opening hours unknown."),
    v.role !== "guest" ? el("button", { class: "primary start-walk", onclick: () => walkThePlan(v, c) }, el("span", { class: "i i-footprints", "aria-hidden": "true" }), " Start walking") : null,
    el("div", { class: "row" },
      el("a", { href: mapsLink(meet.lat, meet.lon), target: "_blank", rel: "noopener" }, el("button", {}, "Map app: to the meeting point")),
      el("a", { href: mapsLink(dest.lat, dest.lon), target: "_blank", rel: "noopener" }, el("button", {}, "Map app: on to the destination"))),
    v.status === "confirmed"
      ? el("p", {}, v.selected_id === c.id ? [el("span", { class: "i i-check", "aria-hidden": "true" }), " Confirmed. See you there!"] : "Another option was confirmed.")
      : (v.role !== "guest" ? el("div", { class: "row" }, el("button", { class: "primary", onclick: async () => {
          await api(`/api/invites/${token}/confirm`, { method: "POST", body: { key, candidate_id: c.id } }); load(); } }, "Confirm this plan")) : null));
}

// ---- After the walk: three questions, stored only with consent (user test, DEV_DOC section 9) ----

const QUESTIONS = [["would_have_gone_out", "Would you have gone out today without this invite?"],
                   ["fair", "Did the meeting point feel fair to both of you?"],
                   ["use_again", "Would you use StrollCall again?"]];
const answers = {};
let surveySent = false;

function survey(v) {
  if (v.feedback_given || surveySent) {
    return el("section", { class: "card survey" }, el("p", {}, el("span", { class: "i i-heart", "aria-hidden": "true" }), " Thanks for telling us how it went!"));
  }
  const send = el("button", { class: "primary", disabled: "" }, "Send");
  const consent = el("input", { type: "checkbox", id: "consent" });
  const minutes = el("input", { type: "number", inputmode: "numeric", min: "1", max: "240", id: "actual-min",
                                placeholder: "e.g. 24", class: "minutes" });
  const status = el("p", { class: "error" });
  const ready = () => QUESTIONS.every(([k]) => answers[k]) && consent.checked;
  const update = () => ready() ? send.removeAttribute("disabled") : send.setAttribute("disabled", "");
  consent.addEventListener("change", update);
  const choice = (k, value, label) => el("button", { type: "button", role: "radio", "aria-checked": String(answers[k] === value),
    // currentTarget, not the event target: buttons hold a canvas and a label span (specular.js).
    onclick: (e) => { const btn = e.currentTarget; answers[k] = value;
      btn.closest(".choices").querySelectorAll("button").forEach((b) => b.setAttribute("aria-checked", String(b === btn))); update(); } }, label);
  send.addEventListener("click", async () => {
    send.setAttribute("disabled", "");
    const n = parseInt(minutes.value, 10);
    try {
      await api(`/api/invites/${token}/feedback`, { method: "POST", body: { key, consent: true, ...answers,
        actual_walk_min: Number.isFinite(n) ? n : null } });
      surveySent = true; load();
    } catch (e) { status.textContent = e.message; send.removeAttribute("disabled"); }
  });
  return el("section", { class: "card survey" },
    el("h2", {}, "After your walk"),
    el("p", { class: "muted" }, "Come back to this link after your walk: three quick questions. We're testing StrollCall with a few friends this week."),
    ...QUESTIONS.map(([k, q]) => el("fieldset", {}, el("legend", {}, q),
      el("div", { class: "choices", role: "radiogroup" }, choice(k, "yes", "Yes"), choice(k, "no", "No"), choice(k, "not_sure", "Not sure")))),
    el("label", { class: "block", for: "actual-min" }, "Optional: how many minutes did your walk take, from your door to the end?"),
    minutes,
    el("label", { class: "consent" }, consent, " I agree that these answers (no names, no locations) may be used in StrollCall's hackathon report."),
    status, el("div", { class: "row" }, send));
}

// In-app guidance: my own leg to the meeting point, then the shared leg to the destination.
function walkThePlan(v, c) {
  const meet = v.places[c.meeting_place_id], dest = v.places[c.endpoint_place_id];
  const mine = v.role === "b" ? c.b_leg : c.a_leg;
  clearTimeout(pollTimer);
  startWalk([
    { id: meet.id, name: meet.name, kind: "meetup", target: [meet.lat, meet.lon], geometry: mine.geometry,
      steps: mine.steps, pois: mine.pois },
    { id: dest.id, name: dest.name, kind: "destination", target: [dest.lat, dest.lon], geometry: c.shared_leg.geometry,
      steps: c.shared_leg.steps, pois: c.shared_leg.pois },
  ], { onFinish: (done, summary) => { if (done) rememberFinishedWalk(token, { ...summary, role: v.role }); load(); } });
}

function drawPlan(v) {
  const m = document.getElementById("map"); m.hidden = false;
  if (!map) map = makeMap("map");
  layers.forEach((l) => l.remove()); layers = [];
  const c = v.candidates[Math.min(chosen, v.candidates.length - 1)];
  const css = getComputedStyle(document.documentElement);
  const color = (name) => css.getPropertyValue(name).trim();
  const line = (leg, c) => L.polyline(leg.geometry, { color: c, weight: 5, opacity: .85 }).addTo(map);
  layers.push(line(c.a_leg, color("--a")), line(c.b_leg, color("--b")), line(c.shared_leg, color("--shared")));
  const meet = v.places[c.meeting_place_id], dest = v.places[c.endpoint_place_id];
  layers.push(L.marker([meet.lat, meet.lon]).addTo(map).bindPopup(`Meet: ${meet.name}`),
              L.marker([dest.lat, dest.lon]).addTo(map).bindPopup(dest.name));
  // The map may have been hidden until now: measure its size first, then fit the plan.
  map.invalidateSize();
  map.fitBounds(L.featureGroup(layers).getBounds(), { padding: [20, 20] });
}

load();
</script>
</body>
</html>
