<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#FBF7EF;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
#stage svg{position:absolute;inset:0}
.vid{position:absolute;overflow:hidden;background:#fff}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<div id="stage"><svg id="bg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg><div id="vids"></div>
<svg id="fg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<script src="lib.js"></script><script src="scenes.js"></script><script src="timeline.js"></script>
<script>
// Clips: the real recordings, transcoded for frame-accurate seeking (build_clips.py).
const CLIPS = { a1: "screen/01_home", a2: "phone/02_solo_voice_glimmer", a3: "screen/03_terminal_glimmer", a4: "phone/04_walking",
  a5: "phone/05_buddy_add_stop", a6: "phone/06_invite_A", a7: "phone/07_accept_B", a8a: "phone/08_plan_A", a8b: "phone/08_plan_B",
  a10: "screen/10_reports_1" };
const els = {};
window.DATA = {};

function drawGraph(raw, fair) {
  // the Manhattan walking graph, turned so the avenues run across the frame, fitted around Midtown-Downtown
  const ang = -61 * Math.PI / 180, k = Math.cos(40.75 * Math.PI / 180);
  const rot = ([lat, lon]) => { const x = lon * k, y = -lat; return [x * Math.cos(ang) - y * Math.sin(ang), x * Math.sin(ang) + y * Math.cos(ang)]; };
  const box = [[40.700, -74.02], [40.700, -73.97], [40.790, -73.93], [40.790, -73.99]].map(rot);
  const xs = box.map((p) => p[0]), ys = box.map((p) => p[1]);
  const sc = Math.min(1820 / (Math.max(...xs) - Math.min(...xs)), 1000 / (Math.max(...ys) - Math.min(...ys)));
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const P = (ll) => { const [x, y] = rot(ll); return [960 + (x - cx) * sc, 560 + (y - cy) * sc]; };
  const cv = document.createElement("canvas"); cv.width = 1920; cv.height = 1080;
  const g = cv.getContext("2d"); g.strokeStyle = "rgba(34,163,90,0.75)"; g.lineWidth = 1.1; g.beginPath();
  for (const line of raw.lines) { line.forEach((ll, i) => { const [x, y] = P(ll); i ? g.lineTo(x, y) : g.moveTo(x, y); }); }
  g.stroke();
  const route = [...fair.meeting.a_route, ...fair.destination.route].map(P);
  const focus = route.reduce((a, p) => [a[0] + p[0] / route.length, a[1] + p[1] / route.length], [0, 0]);
  return { png: cv.toDataURL("image/png"), route, focus, nodes_total: raw.graph_nodes_total };
}

window.ready = (async () => {
  const [fair, graph, durs] = await Promise.all(["fairness_example.json", "walking_graph_manhattan.json"].map((f) =>
    fetch("../../assets/data/" + f).then((r) => r.json())).concat([fetch("../../assets/vo_tts/durations.json").then((r) => r.json())]));
  DATA.fair = fair; DATA.graph = drawGraph(graph, fair);
  window.CAPS = captionChunks(durs);
  await document.fonts.load('700 40px Fredoka'); await document.fonts.load('800 40px Nunito'); await document.fonts.ready;
  for (const [id, f] of Object.entries(CLIPS)) {
    const d = document.createElement("div"); d.className = "vid"; d.style.display = "none";
    // the whole clip in memory (a blob URL), so every seek is exact without HTTP range requests
    const blob = await (await fetch("../../assets/clips/" + f.split("/")[1] + ".mp4")).blob();
    const v = document.createElement("video"); v.src = URL.createObjectURL(blob); v.muted = true; v.preload = "auto";
    d.appendChild(v); document.getElementById("vids").appendChild(d); els[id] = { d, v };
    await new Promise((r) => (v.readyState >= 1 ? r() : v.addEventListener("loadedmetadata", r, { once: true })));
  }
  return { total: TOTAL, caps: window.CAPS };
})();

function seek(v, t) {
  t = Math.max(0, Math.min(t, v.duration - 0.04));
  if (Math.abs(v.currentTime - t) < 0.001 && v.readyState >= 2) return Promise.resolve();
  return new Promise((r) => { v.addEventListener("seeked", () => r(), { once: true }); v.currentTime = t; });
}

window.renderFrame = async (t) => {
  const sc = T.find((s) => t >= s.start && t < s.start + s.dur) || T[T.length - 1];
  const out = sc.draw(t - sc.start);
  document.getElementById("bg").innerHTML = DEFS + (out.bg || "");
  document.getElementById("fg").innerHTML = DEFS + (out.fg || "") + wipe(t) + captionSvg(t);
  const used = new Set();
  const waits = [];
  for (const vd of out.videos || []) {
    const e = els[vd.clip]; used.add(vd.clip);
    const s = vd.scale || 1;
    Object.assign(e.d.style, { display: "block", left: vd.x + "px", top: vd.y + "px", width: vd.w + "px", height: vd.h + "px",
      borderRadius: (vd.r || 0) + "px", opacity: vd.opacity ?? 1,
      transform: `scale(${s})`, transformOrigin: `${50 + 100 * (vd.ox || 0)}% ${50 - 100 * (0.5 - (vd.oy ?? 0.5))}%` });
    e.v.style.objectPosition = `50% ${vd.top ? "0%" : "50%"}`;
    waits.push(seek(e.v, vd.t));
  }
  for (const [id, e] of Object.entries(els)) if (!used.has(id)) e.d.style.display = "none";
  await Promise.all(waits);
  await new Promise((r) => setTimeout(r, 0));
  return sc.id;
};
</script></body></html>
