<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#FBF7EF}svg{display:block}</style>
</head><body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
// render(scene, t): draw one frame. window.ready resolves once fonts and data are in.
window.DATA = {};
window.ready = (async () => {
  window.DATA.fair = await (await fetch("../../assets/data/fairness_example.json")).json();
  await document.fonts.load('700 40px Fredoka'); await document.fonts.load('800 40px Nunito'); await document.fonts.ready;
})();
window.render = (id, t) => { document.getElementById("stage").innerHTML = DEFS + SCENES[id].draw(t); };
</script>
</body></html>
